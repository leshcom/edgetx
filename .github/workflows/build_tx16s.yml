---
# Fork-only workflow: build RadioMaster TX16S firmware (EdgeTX 2.9.4 base).
name: Build TX16S firmware (2.9.4)
on:
  push:
    branches:
      - 'usb-rc-out-2.9.4'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - tx16s
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Образ 2.9 має стару glibc, тож JS-дії GitHub у ньому не працюють:
      # репозиторій завантажуємо на хості, а збираємо в контейнері.
      - name: Build ${{ matrix.target }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e FLAVOR=${{ matrix.target }} -e GITHUB_REF -e GITHUB_SHA \
            ghcr.io/edgetx/edgetx-dev:2.9.1 \
            bash -c 'git config --global --add safe.directory "*" && ./tools/build-gh.sh'

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}-2.9.4-${{ github.sha }}
          path: |
            fw.json
            *.bin
          retention-days: 30
          if-no-files-found: error
